function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function normDateStr(s){if(!s)return '';s=String(s).toLowerCase().trim().replace(/[áàã]/g,'a').replace(/[éê]/g,'e').replace(/[í]/g,'i').replace(/[óô]/g,'o').replace(/[ú]/g,'u').replace(/[ç]/g,'c').replace(/['\s]/g,'');return s;}

function parseDmy(s){s=normDateStr(s);if(!s)return null;var m=s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})$/);if(!m)return null;var d=parseInt(m[1]),mo=parseInt(m[2])-1,y=parseInt(m[3]);if(d<1||d>31||mo<0||mo>11)return null;if(y<100)y+=2000;return new Date(y,mo,d);}

function parseDdMmm(s){s=normDateStr(s);if(!s)return null;var m=s.match(/^(\d{1,2})[\-\/\.]([a-z]{3,12})(?:[\-\/\.](\d{2,4}))?$/);if(!m){m=s.match(/^(\d{1,2})([a-z]{3,12})(\d{2,4})?$/);if(!m)return null;}var d=parseInt(m[1]),mo=MESES_MAP[m[2].substr(0,3)];if(mo==null||d<1||d>31)return null;var yr=m[3]?parseInt(m[3]):2026;if(yr<100)yr+=2000;return new Date(yr,mo,d);}

function parseDate2(s){if(!s)return null;var sn=normDateStr(s);if(!sn||sn==='ok'||sn==='?')return null;return parseDmy(sn)||parseDdMmm(sn);}

function _isOk(v){return v&&String(v).toLowerCase().trim()==='ok';}

function _wdh(d){return _WORK_DAY_H[d.getDay()]||0;}

function _tvPanorama(){
  var ativos=_tvActiveRows();
  var hoje=new Date();hoje.setHours(0,0,0,0);
  var sem=_rondaSemanaBase(hoje);
  var noPrazo=0,atras=0,entregSemana=0,concl=0;
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    if(r.status==='entregue'){concl++;continue;}
    if(r.status==='pendente'||r.status==='planejamento')continue;
    var mf=parseDate2(r.maq_final),ent=parseDate2(r.entrega);
    if(mf&&ent){if(mf>ent)atras++;else noPrazo++;}
    if(mf&&mf>=sem.seg&&mf<=sem.dom)entregSemana++;
  }
  var h='<div style="height:100%;display:flex;flex-direction:column;gap:22px">';
  h+='<div style="display:flex;gap:18px">';
  h+=_tvKpiBox(ativos.length,'Projetos Ativos',_TVC.cyan);
  h+=_tvKpiBox(noPrazo,'No Prazo',_TVC.green);
  h+=_tvKpiBox(atras,'Em Atraso',_TVC.red);
  h+=_tvKpiBox(entregSemana,'Entregas na Semana',_TVC.amber);
  h+='</div>';
  var tot=noPrazo+atras,pctPrazo=tot>0?Math.round(noPrazo/tot*100):0;
  h+='<div style="background:'+_TVC.card+';border:1px solid '+_TVC.brd+';border-radius:18px;padding:28px 32px;box-shadow:0 1px 3px rgba(0,0,0,.05)">';
  h+='<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px">';
  h+='<div style="font-size:18px;font-weight:800;color:'+_TVC.txt2+'">SAÚDE DA CARTEIRA</div>';
  h+='<div style="font-size:44px;font-weight:900;color:'+(pctPrazo>=70?_TVC.green:pctPrazo>=40?_TVC.amber:_TVC.red)+'">'+pctPrazo+'% <span style="font-size:18px;color:'+_TVC.txt3+';font-weight:700">no prazo</span></div>';
  h+='</div>';
  h+='<div style="height:34px;background:'+_TVC.bg+';border-radius:17px;overflow:hidden;display:flex">';
  h+='<div style="width:'+pctPrazo+'%;background:linear-gradient(90deg,#059669,#10b981);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#fff">'+(pctPrazo>12?noPrazo+' no prazo':'')+'</div>';
  h+='<div style="flex:1;background:linear-gradient(90deg,#dc2626,#ef4444);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#fff">'+((100-pctPrazo)>12?atras+' atrasados':'')+'</div>';
  h+='</div></div>';
  h+='<div style="display:flex;gap:18px">';
  h+=_tvKpiBox(concl,'Concluídos / Entregues',_TVC.purple);
  h+=_tvKpiBox(rows.length,'Total na Carteira',_TVC.blue);
  var prox=0,lim=new Date(sem.dom.getTime()+7*864e5);
  for(var j=0;j<rows.length;j++){var r2=rows[j];if(['pendente','planejamento','entregue'].indexOf(r2.status)<0){var m2=parseDate2(r2.maq_final);if(m2&&m2>sem.dom&&m2<=lim)prox++;}}
  h+=_tvKpiBox(prox,'Entregas Próx. Semana',_TVC.orange);
  h+='</div></div>';
  return h;
}

      if(!_phaseReachable(r,s.ck))continue;/* match exato: só mostra se o status real é este setor */

      if(_rondaDoneSet&&_rondaDoneSet[r.projeto+'\u00b7'+s.ck])continue;

function _computeFasesVencendo(){
  var hoje=new Date();hoje.setHours(0,0,0,0);
  var limite=new Date(hoje.getTime()+3*864e5);limite.setHours(23,59,59,999);
  var _allDoneSt=['aguardando','em_desmontagem_carga','carregada','entregue','modificacoes'];
  var out=[];
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    if(r.status==='entregue'||r.status==='pendente'||r.status==='planejamento')continue;
    var fOk=r.fasesOk||[];
    var _cSI=-1;
    for(var _ki=0;_ki<FASE_SEQ.length;_ki++){if(FASE_SEQ[_ki].st===r.status){_cSI=_ki;break;}}
    for(var f=0;f<FASE_SEQ.length;f++){
      var fase=FASE_SEQ[f],fimV=r[fase.fim];
      if(fOk.indexOf(fase.chip)>=0)continue;
      if(_allDoneSt.indexOf(r.status)>=0||(_cSI>0&&f<_cSI))continue;
      if(!fimV||_isOk(fimV))continue;
      var d=parseDate2(fimV);if(!d)continue;
      d.setHours(0,0,0,0);
      if(d>=hoje&&d<=limite){
        out.push({idx:i,proj:r.projeto,cli:r.cliente,fase:fase.lbl,fim:fimV,dias:Math.round((d-hoje)/864e5)});
      }
    }
  }
  out.sort(function(a,b){return a.dias-b.dias;});
  return out;
}

function _getHorasTotal(r){
  /* Calcula horas totais por processo para um projeto */
  var result={};
  PROC_KEYS.forEach(function(pk){result[pk]=0;});
  var modelo=r.horas_modelo||'';
  /* Horas do modelo principal — somente se existir no banco */
  if(modelo&&HORAS_DB.horas&&HORAS_DB.maquinas.indexOf(modelo)>=0){
    PROC_KEYS.forEach(function(pk){
      var h=HORAS_DB.horas[pk];
      if(h&&typeof h[modelo]==='number')result[pk]+=h[modelo];
    });
  }
  /* Horas dos implementos selecionados — somente se existirem no banco */
  var imps=r.horas_implementos||[];
  imps.forEach(function(imp){
    if(HORAS_DB.implementos.indexOf(imp)<0)return;/* implemento não existe mais */
    PROC_KEYS.forEach(function(pk){
      var h=HORAS_DB.horas[pk];
      if(h&&typeof h[imp]==='number')result[pk]+=h[imp];
    });
  });
  /* Aplicar customizações */
  var custom=r.horas_custom||{};
  Object.keys(custom).forEach(function(k){
    if(result.hasOwnProperty(k)){var _cv=parseFloat(custom[k]);if(!isNaN(_cv))result[k]=_cv;}
  });
  result.total=PROC_KEYS.reduce(function(s,pk){return s+result[pk];},0);
  return result;
}

  var out=[];
  for(var i=0;i<rows.length;i++){

    if(r.status==='entregue'||r.status==='pendente'||r.status==='planejamento')continue;
    var ini=r[s.ini]||'',fim=r[s.fim]||'';
    var fimD=parseDate2(fim);
    var _rdKey=_rondaDoneKey(r.projeto,s.chip);
    var concluida=(r.fasesOk||[]).indexOf(s.chip)>=0 || _isOk(fim) || !!_rondaDoneSet[_rdKey];
    if(!fimD && !concluida)continue;
    var diasFim=fimD?Math.round((fimD-hoje)/864e5):null;
    var incluir=false;
    if(concluida){
      incluir=_rondaIncluiConcluidas && fimD && fimD>=sem.seg && fimD<=sem.dom;
    }else if(_rondaJanela==='semana'){
      incluir=fimD>=sem.seg && fimD<=sem.dom;
    }else if(_rondaJanela==='sem7'){
      incluir=fimD>=sem.seg && fimD<=lim7;
    }else if(_rondaJanela==='atrasadas'){
      incluir=fimD<hoje;
    }else{
      incluir=true;
    }
    if(!incluir)continue;
    out.push({idx:i,proj:r.projeto,cli:r.cliente||'',modelo:r.modelo||'',ini:ini,fim:fim,fimD:fimD,diasFim:diasFim,concluida:concluida,status:r.status||''});
  }
  out.sort(function(a,b){
    if(a.concluida!==b.concluida)return a.concluida?1:-1;
    if(!a.fimD)return 1;if(!b.fimD)return -1;
    return a.fimD-b.fimD;
  });
  return out;
}

function _rondaSemanaBase(d){
  var dd=new Date(d);dd.setHours(0,0,0,0);
  var dow=dd.getDay()||7;
  var seg=new Date(dd.getTime()-(dow-1)*864e5);
  var dom=new Date(seg.getTime()+6*864e5);
  return {seg:seg, dom:dom};
}

function _rondaDoneKey(proj,chip){return proj+'\u00b7'+chip;}

function _rondaFindSetor(chip){for(var i=0;i<_RONDA_SETORES.length;i++)if(_RONDA_SETORES[i].chip===chip)return _RONDA_SETORES[i];return _RONDA_SETORES[4];}



var _tv={idx:0,playing:true,speed:12,prog:0,tick:null,clockTimer:null};
var _tvCargaPairIdx=0,_tvHorasPairIdx=0;

function _tvClock(){var el=document.getElementById('tv-clock');if(!el)return;var d=new Date();el.textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2);}
function _tvRenderDots(){var el=document.getElementById('tv-dots');if(!el)return;var h='';for(var i=0;i<_TV_PANELS.length;i++){h+='<span onclick="_tvGoto('+i+')" style="width:9px;height:9px;border-radius:50%;cursor:pointer;background:'+(i===_tv.idx?_TVC.cyan:_TVC.brd2)+'"></span>';}el.innerHTML=h;}
function _tvUpdateSpeed(){var el=document.getElementById('tv-speed');if(el)el.textContent=_tv.speed+'s';}
function _tvSpeed(delta){_tv.speed=Math.max(4,Math.min(40,_tv.speed+delta));_tvUpdateSpeed();if(_tv.playing){_tvStopTimer();_tvStartTimer();}}
function _tvTogglePlay(){_tv.playing=!_tv.playing;var b=document.getElementById('tv-playbtn');if(b)b.textContent=_tv.playing?'⏸':'▶';if(_tv.playing){_tvStartTimer();}else{_tvStopTimer();}}
function _tvStartTimer(){_tvStopTimer();_tv.prog=0;_tv.tick=setInterval(function(){_tv.prog+=100/(_tv.speed*10);var pb=document.getElementById('tv-progress');if(pb)pb.style.width=Math.min(100,_tv.prog)+'%';if(_tv.prog>=100)_tvNext(false);},100);}
function _tvStopTimer(){if(_tv.tick){clearInterval(_tv.tick);_tv.tick=null;}}
function _tvNext(manual){
  var cur=_TV_PANELS[_tv.idx];
  if(cur.id==='cargah'&&_tvCargaPairIdx<_TV_CARGA_PAIRS.length-1){_tvCargaPairIdx++;_tv.prog=0;_tvRender();if(manual&&_tv.playing){_tvStopTimer();_tvStartTimer();}return;}
  if(cur.id==='cargahoras'&&_tvHorasPairIdx<_TV_HORAS_PAIRS.length-1){_tvHorasPairIdx++;_tv.prog=0;_tvRender();if(manual&&_tv.playing){_tvStopTimer();_tvStartTimer();}return;}
  if(cur.id==='cargah')_tvCargaPairIdx=0;
  if(cur.id==='cargahoras')_tvHorasPairIdx=0;
  _tv.idx=(_tv.idx+1)%_TV_PANELS.length;_tv.prog=0;_tvRender();
  if(manual&&_tv.playing){_tvStopTimer();_tvStartTimer();}
}
function _tvPrev(){
  var cur=_TV_PANELS[_tv.idx];
  if(cur.id==='cargah'&&_tvCargaPairIdx>0){_tvCargaPairIdx--;_tv.prog=0;_tvRender();if(_tv.playing){_tvStopTimer();_tvStartTimer();}return;}
  if(cur.id==='cargahoras'&&_tvHorasPairIdx>0){_tvHorasPairIdx--;_tv.prog=0;_tvRender();if(_tv.playing){_tvStopTimer();_tvStartTimer();}return;}
  _tv.idx=(_tv.idx-1+_TV_PANELS.length)%_TV_PANELS.length;_tvCargaPairIdx=0;_tvHorasPairIdx=0;_tv.prog=0;_tvRender();
  if(_tv.playing){_tvStopTimer();_tvStartTimer();}
}
function _tvGoto(i){_tv.idx=i;_tvCargaPairIdx=0;_tvHorasPairIdx=0;_tv.prog=0;_tvRender();if(_tv.playing){_tvStopTimer();_tvStartTimer();}}

function _tvRender(dataOnly){
  var panel=_TV_PANELS[_tv.idx];
  var tt=document.getElementById('tv-panel-title');
  if(tt){var titleTxt=panel.icon+'  '+panel.title;if(panel.id==='cargah')titleTxt+='  ('+(_tvCargaPairIdx+1)+'/'+_TV_CARGA_PAIRS.length+')';if(panel.id==='cargahoras')titleTxt+='  ('+(_tvHorasPairIdx+1)+'/'+_TV_HORAS_PAIRS.length+')';tt.textContent=titleTxt;}
  var ct=document.getElementById('tv-content');
  if(!ct)return;
  var html='';
  if(panel.id==='panorama')html=_tvPanorama();
  else if(panel.id==='funil')html=_tvFunil();
  else if(panel.id==='cargah')html=_tvCargaHoraria();
  else if(panel.id==='cargahoras')html=_tvCargaHorasSetor();
  else if(panel.id==='ronda')html=_tvRonda();
  else if(panel.id==='entregas')html=_tvEntregas();
  else if(panel.id==='alertas')html=_tvAlertas();
  ct.innerHTML='<div>'+html+'</div>';
  if(!dataOnly)_tvRenderDots();
}

function _tvBuildChrome(){
  var ov=document.getElementById('tv-root');
  var h='';
  h+='<div style="display:flex;align-items:center;justify-content:space-between;padding:18px 36px;background:'+_TVC.card+';border-bottom:2px solid '+_TVC.brd+';flex-shrink:0">';
  h+='<div style="display:flex;align-items:center;gap:20px">';
  h+='<div style="font-size:26px;font-weight:900;letter-spacing:1px;color:'+_TVC.cyan+'">SPK MAQINOX</div>';
  h+='<div style="width:2px;height:28px;background:'+_TVC.brd2+'"></div>';
  h+='<div id="tv-panel-title" style="font-size:20px;font-weight:800;color:'+_TVC.txt+'"></div>';
  h+='</div>';
  h+='<div style="display:flex;align-items:center;gap:24px">';
  h+='<div style="display:flex;align-items:center;gap:8px"><span style="width:11px;height:11px;border-radius:50%;background:'+_TVC.green+';box-shadow:0 0 10px '+_TVC.green+';animation:tvpulse 1.6s infinite"></span><span style="font-size:13px;font-weight:900;color:'+_TVC.green+';letter-spacing:1px">AO VIVO</span></div>';
  h+='<div id="tv-clock" style="font-size:22px;font-weight:800;color:'+_TVC.txt+';font-variant-numeric:tabular-nums"></div>';
  h+='<div id="tv-pubinfo" style="font-size:11px;color:'+_TVC.txt3+'"></div>';
  h+='</div></div>';
  h+='<div id="tv-content" style="flex:1;overflow:hidden;padding:26px 34px;position:relative;background:'+_TVC.bg+'"></div>';
  h+='<div style="flex-shrink:0;padding:14px 36px;background:'+_TVC.card+';border-top:2px solid '+_TVC.brd+'">';
  h+='<div style="height:5px;background:'+_TVC.brd+';border-radius:3px;overflow:hidden;margin-bottom:12px"><div id="tv-progress" style="height:100%;width:0%;background:linear-gradient(90deg,#06b6d4,'+_TVC.cyan+');transition:width .25s linear"></div></div>';
  h+='<div style="display:flex;align-items:center;justify-content:space-between">';
  h+='<div style="display:flex;align-items:center;gap:8px">';
  h+='<button onclick="_tvPrev()" style="background:'+_TVC.bg+';border:1px solid '+_TVC.brd2+';color:'+_TVC.txt+';width:40px;height:40px;border-radius:10px;font-size:16px;cursor:pointer">◀</button>';
  h+='<button id="tv-playbtn" onclick="_tvTogglePlay()" style="background:linear-gradient(135deg,#0891b2,#06b6d4);border:none;color:#fff;width:48px;height:40px;border-radius:10px;font-size:16px;cursor:pointer;font-weight:900">⏸</button>';
  h+='<button onclick="_tvNext(true)" style="background:'+_TVC.bg+';border:1px solid '+_TVC.brd2+';color:'+_TVC.txt+';width:40px;height:40px;border-radius:10px;font-size:16px;cursor:pointer">▶</button>';
  h+='</div>';
  h+='<div id="tv-dots" style="display:flex;gap:10px"></div>';
  h+='<div style="display:flex;align-items:center;gap:10px;font-size:12px;color:'+_TVC.txt2+'">';
  h+='<span>Velocidade</span>';
  h+='<button onclick="_tvSpeed(-4)" style="background:'+_TVC.bg+';border:1px solid '+_TVC.brd2+';color:'+_TVC.txt+';width:32px;height:32px;border-radius:8px;cursor:pointer">−</button>';
  h+='<span id="tv-speed" style="font-weight:800;color:'+_TVC.cyan+';min-width:46px;text-align:center"></span>';
  h+='<button onclick="_tvSpeed(4)" style="background:'+_TVC.bg+';border:1px solid '+_TVC.brd2+';color:'+_TVC.txt+';width:32px;height:32px;border-radius:8px;cursor:pointer">+</button>';
  h+='</div></div></div>';
  h+='<style>@keyframes tvpulse{0%,100%{opacity:1}50%{opacity:.3}}@keyframes tvfade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}#tv-content>div{animation:tvfade .45s ease}</style>';
  ov.innerHTML=h;
  _tvRenderDots();_tvUpdateSpeed();_tvClock();
  if(_tv.clockTimer)clearInterval(_tv.clockTimer);
  _tv.clockTimer=setInterval(_tvClock,1000);
}

document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight')_tvNext(true);
  else if(e.key==='ArrowLeft')_tvPrev();
  else if(e.key===' '){e.preventDefault();_tvTogglePlay();}
});

async function _carregarDados(silencioso){
  try{
    var r=await fetch(DADOS_URL+(DADOS_URL.indexOf('?')>=0?'&':'?')+'_ts='+Date.now());
    if(!r.ok)throw new Error('HTTP '+r.status);
    var data=await r.json();
    rows=(data.rows||[]).map(function(r){return r;});
    if(data.hdrTitle)hdrTitle=data.hdrTitle;
    if(data.hdrSub)hdrSub=data.hdrSub;
    if(data.ganttCap)_ganttCap=data.ganttCap;
    _lastPublishedAt=data.publishedAt||'';
    var pi=document.getElementById('tv-pubinfo');
    if(pi&&_lastPublishedAt)pi.textContent='Publicado: '+_lastPublishedAt;
    if(!silencioso)_tvRender(true);
    else _tvRender(true);
    return true;
  }catch(err){
    if(!silencioso){
      document.getElementById('tv-loading').style.display='none';
      document.getElementById('tv-err').style.display='flex';
      document.getElementById('tv-err-msg').textContent=String(err.message||err);
    }
    return false;
  }
}

async function _boot(){
  var ok=await _carregarDados(false);
  if(!ok)return;
  document.getElementById('tv-loading').style.display='none';
  document.getElementById('tv-root').style.display='flex';
  _tvBuildChrome();
  _tvRender();
  _tvStartTimer();
  setInterval(function(){_carregarDados(true);},POLL_MS);
}
_boot();
</script>
